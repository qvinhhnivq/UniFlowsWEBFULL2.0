<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SmartLink — UniFLOWs Label</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:image" content="/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800;900&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body.listen-body {
      background: #090a0f;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .liquid-platform-row:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      border-color: rgba(255, 255, 255, 0.28) !important;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45) !important;
    }
    .liquid-platform-row:hover .liquid-play-btn {
      background: #ffffff !important;
      color: #000000 !important;
      transform: scale(1.04);
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.3) !important;
    }
    #smart-btn-share:hover {
      background: #ffffff !important;
      color: #000000 !important;
      border-color: #ffffff !important;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25) !important;
    }
    #smart-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(255, 255, 255, 0.4) !important;
    }
  </style>
</head>
<body class="listen-body">
  <main data-smartlink-page></main>
  <script type="module" src="/assets/smartlink.js"></script>
</body>
</html>
