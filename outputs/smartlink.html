<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SmartLink — UniFLOWs Label</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:image" content="/og-image.jpg">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    body.listen-body {
      background: #090a0b;
      color: #fff;
      min-height: 100vh;
      margin: 0;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .smart-page {
      width: min(540px, 92vw);
      margin: 0 auto;
      min-height: 100vh;
      padding: 36px 20px 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .platform-link-item:hover {
      border-color: #cbff00 !important;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(203, 255, 0, 0.15);
    }
    #smart-btn-share:hover {
      border-color: #cbff00 !important;
      color: #cbff00 !important;
    }
  </style>
</head>
<body class="listen-body">
  <main data-smartlink-page></main>
  <script type="module" src="/assets/smartlink.js"></script>
</body>
</html>
