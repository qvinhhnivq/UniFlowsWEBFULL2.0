<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Nhà Sản Xuất — Uni-HUBE | UniFLOWs</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:image" content="/og-image.jpg">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .producer-track-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 140px;
      gap: 16px;
      align-items: center;
      padding: 20px 3vw;
      border-bottom: 1px solid var(--line);
      background: transparent;
      transition: background 0.2s;
    }
    .producer-track-row:hover {
      background: var(--paper);
    }
    .producer-track-row strong {
      font-size: clamp(20px, 3vw, 36px);
      letter-spacing: -0.06em;
      line-height: 1;
      margin: 0;
    }
    @media (max-width: 768px) {
      .producer-track-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body data-page="producer">
  <main data-producer-detail class="detail-shell">
    <!-- Rendered dynamically -->
  </main>

  <script type="module">
    import { getData, saveData } from './assets/data.js';
    import './assets/security.js';
    import './assets/app.js';

    const root = document.querySelector('[data-producer-detail]');
    if (root) {
      const data = await getData();
      const unihube = data.unihube || {};
      const params = new URLSearchParams(location.search);
      const prodId = params.get('id');

      const producer = (unihube.producers || []).find(p => p.id === prodId) || (unihube.producers || [])[0];

      if (!producer) {
        root.innerHTML = '<div style="padding:10vw 3vw;text-align:center;"><h2>Không tìm thấy thông tin nhà sản xuất.</h2><a href="unihube" class="button">← Quay lại Uni-HUBE</a></div>';
      } else {
        const tracks = producer.tracks || [];

        root.innerHTML = `
          <!-- 01: Hero Profile (Identical to artist.html) -->
          <section class="artist-detail">
            <img src="${producer.image || 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1000&q=85'}" alt="${producer.name}">
            <div>
              <span class="eyebrow" style="color:#d97706;">Uni-HUBE / ${producer.role}</span>
              <h1>${producer.name}</h1>
              <p>${producer.bio}</p>
              
              <div style="margin: 20px 0; font: 12px 'DM Mono', monospace;">
                <span style="color:#666;text-transform:uppercase;">Thể loại sở trường:</span>
                <strong style="color:#000;display:block;margin-top:4px;">● ${producer.specialty}</strong>
              </div>

              <div style="margin: 20px 0; font: 12px 'DM Mono', monospace;">
                <span style="color:#666;text-transform:uppercase;">Chi phí cơ bản (Rate):</span>
                <strong style="color:#16a34a;font-size:16px;display:block;margin-top:4px;">${producer.priceRate || 'Theo thỏa thuận'}</strong>
              </div>

              ${producer.sampleAudio ? `
                <div style="margin: 20px 0;">
                  <span style="font: 11px 'DM Mono', monospace; text-transform: uppercase; color: #666; display: block; margin-bottom: 6px;">🎧 Audio Showreel:</span>
                  <audio controls src="${producer.sampleAudio}" style="width: 100%; height: 32px;"></audio>
                </div>
              ` : ''}

              <div class="actions" style="margin-top: 30px;">
                <a href="#booking-section" class="button" style="background: var(--ink); color: #fff; padding: 14px 24px;">
                  🎯 Đặt Lịch Làm Việc Với ${producer.name.split(' ')[0]} →
                </a>
                <a href="unihube" class="button alt" style="padding: 14px 20px;">
                  ← Uni-HUBE Roster
                </a>
              </div>
            </div>
          </section>

          <!-- 02: Featured Discography (Same style as releases on artist.html) -->
          <section class="releases">
            <div class="section-head">
              <h2>02 / Ca Khúc Tiêu Biểu & Bản Phối (Discography)</h2>
              <span class="kicker">${tracks.length} Featured Tracks</span>
            </div>
            
            ${tracks.length > 0 ? tracks.map(tr => `
              <div class="producer-track-row">
                <div>
                  <span class="eyebrow" style="color:#d97706;font-size:10px;">${tr.role || 'Produced by ' + producer.name}</span>
                  <strong>${tr.title}</strong>
                  <span style="display:block;font-size:14px;color:#555;margin-top:2px;">Nghệ sĩ thể hiện: <b>${tr.artist}</b> (${tr.releaseYear || '2026'})</span>
                </div>
                <div>
                  ${tr.audioUrl ? `
                    <audio controls src="${tr.audioUrl}" style="width: 100%; height: 32px;"></audio>
                  ` : '<span style="font-size:12px;color:#888;">Lossless Studio Master</span>'}
                </div>
                <div>
                  <span style="font: 12px 'DM Mono', monospace; font-weight: bold; color: #16a34a;">
                    ${tr.streams || '✓ Live on DSPs'}
                  </span>
                </div>
                <div style="text-align: right;">
                  <a href="#booking-section" class="kicker" style="color: var(--ink); border-bottom: 1px solid;">
                    Sản xuất tương tự ↗
                  </a>
                </div>
              </div>
            `).join('') : '<p class="empty" style="padding:30px 3vw;">Chưa cập nhật danh sách ca khúc tiêu biểu.</p>'}
          </section>

          <!-- 03: Direct Booking Form -->
          <section class="big-copy" id="booking-section" style="border-bottom: 0;">
            <span class="kicker">03 / Đặt Lịch Trực Tiếp</span>
            <div>
              <h2>Làm việc cùng <em>${producer.name}</em></h2>
              <p>
                Gửi ý tưởng bài hát hoặc bản demo. Chúng tôi sẽ phản hồi trực tiếp kèm phương án sản xuất và hợp đồng trong vòng 24 giờ.
              </p>

              <div style="background: #fafafa; border: 1px solid var(--ink); padding: 32px; margin-top: 24px;">
                <form id="direct-producer-booking-form" style="display: grid; gap: 16px;">
                  <div class="mini-grid">
                    <div class="field">
                      <label>Dịch vụ yêu cầu *</label>
                      <select id="direct-service" style="padding: 12px; border: 1px solid var(--ink); background: #fff; font: 14px Manrope, sans-serif;">
                        <option value="full-production">Sản xuất Ca khúc Trọn gói (Full Track Production)</option>
                        <option value="mixing-mastering">Mixing & Mastering 24-bit Lossless</option>
                        <option value="songwriting-topline">Sáng tác Giai điệu & Lời (Songwriting & Topline)</option>
                        <option value="vocal-production">Vocal Tuning & Xử lý Thanh nhạc</option>
                      </select>
                    </div>
                    <div class="field">
                      <label>Dự toán ngân sách</label>
                      <select id="direct-budget" style="padding: 12px; border: 1px solid var(--ink); background: #fff; font: 14px Manrope, sans-serif;">
                        <option value="10 - 20 Triệu VNĐ">10 - 20 Triệu VNĐ</option>
                        <option value="20 - 40 Triệu VNĐ">20 - 40 Triệu VNĐ</option>
                        <option value="Trên 40 Triệu VNĐ">Trên 40 Triệu VNĐ</option>
                      </select>
                    </div>
                  </div>

                  <div class="mini-grid">
                    <div class="field">
                      <label>Họ tên nghệ sĩ / Đại diện *</label>
                      <input id="direct-name" type="text" required placeholder="Ví dụ: Ca sĩ Tuấn Kiệt">
                    </div>
                    <div class="field">
                      <label>Email liên hệ *</label>
                      <input id="direct-email" type="email" required placeholder="tuankiet@gmail.com">
                    </div>
                  </div>

                  <div class="mini-grid">
                    <div class="field">
                      <label>Số điện thoại / Zalo *</label>
                      <input id="direct-phone" type="tel" required placeholder="0908xxxxxx">
                    </div>
                    <div class="field">
                      <label>Link Demo (Google Drive, Soundcloud...)</label>
                      <input id="direct-demo" type="url" placeholder="https://drive.google.com/...">
                    </div>
                  </div>

                  <div class="field">
                    <label>Mô tả chi tiết concept dự án & Timeline</label>
                    <textarea id="direct-notes" rows="3" placeholder="Mô tả phong cách mong muốn..."></textarea>
                  </div>

                  <div id="direct-booking-notice" class="notice"></div>

                  <div class="actions">
                    <button type="submit" id="direct-submit-btn" class="button" style="background: var(--ink); color: #fff; padding: 16px 28px;">
                      🚀 Gửi Yêu Cầu Làm Việc Với ${producer.name.split(' ')[0]} →
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </section>
        `;

        // Direct Booking Form Submission
        const form = document.querySelector('#direct-producer-booking-form');
        const notice = document.querySelector('#direct-booking-notice');
        if (form) {
          form.onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.querySelector('#direct-submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang gửi...';

            const clientName = document.querySelector('#direct-name').value.trim();
            const clientEmail = document.querySelector('#direct-email').value.trim();
            const clientPhone = document.querySelector('#direct-phone').value.trim();
            const serviceType = document.querySelector('#direct-service').selectedOptions[0]?.textContent || 'Full Track';
            const budget = document.querySelector('#direct-budget').value;
            const demoUrl = document.querySelector('#direct-demo').value.trim();
            const notes = document.querySelector('#direct-notes').value.trim();

            const newInquiry = {
              id: `inq-${Date.now()}`,
              clientName,
              clientEmail,
              clientPhone,
              producerId: producer.id,
              producerName: producer.name,
              serviceType,
              budget,
              demoUrl,
              notes,
              status: 'Mới tiếp nhận',
              createdAt: new Date().toLocaleDateString('vi-VN')
            };

            const liveData = await getData();
            if (!liveData.unihube) liveData.unihube = JSON.parse(JSON.stringify(unihube));
            if (!liveData.unihube.inquiries) liveData.unihube.inquiries = [];

            liveData.unihube.inquiries.unshift(newInquiry);
            await saveData(liveData);

            if (notice) {
              notice.textContent = `✓ Cảm ơn ${clientName}! Yêu cầu làm việc với Producer ${producer.name} đã được gửi thành công. Chúng tôi sẽ phản hồi trong vòng 24h.`;
              notice.style.display = 'block';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = `🚀 Gửi Yêu Cầu Làm Việc Với ${producer.name.split(' ')[0]} →`;
            form.reset();
          };
        }
      }
    }
  </script>
</body>
</html>
