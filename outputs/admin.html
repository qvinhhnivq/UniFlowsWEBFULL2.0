<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Quản trị nội dung & Phân phối — UniFLOWs</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <main class="admin">
    <span class="eyebrow">UniFLOWs / Content & Distribution Manager</span>
    <h1>Quản trị<br>hệ thống.</h1>
    
    <p class="notice" id="notice" style="display: none;">Đã lưu thay đổi vào cơ sở dữ liệu Supabase.</p>

    <form id="site-form">
      <!-- Section: Thông tin chung -->
      <section class="admin-section">
        <h2>Thông tin chung</h2>
        <div class="field">
          <label>Tiêu đề trang chủ (Tagline)</label>
          <input name="tagline">
        </div>
        <div class="field">
          <label>Mô tả đầu trang (Hero text)</label>
          <textarea name="heroText" rows="3"></textarea>
        </div>
        <div class="field">
          <label>Tiêu đề giới thiệu (About title)</label>
          <textarea name="aboutTitle" rows="2"></textarea>
        </div>
        <div class="field">
          <label>Nội dung giới thiệu (About text)</label>
          <textarea name="aboutText" rows="4"></textarea>
        </div>
        <div class="mini-grid">
          <div class="field">
            <label>Email liên hệ</label>
            <input name="email">
          </div>
          <div class="field">
            <label>Thành phố</label>
            <input name="city">
          </div>
        </div>
      </section>

      <!-- Section: Duyệt phát hành từ nghệ sĩ -->
      <section class="admin-section">
        <h2>Duyệt bản phát hành từ Nghệ sĩ (Distribution Queue)</h2>
        <div id="releases-reviewer">
          <p class="empty">Đang tải danh sách release...</p>
        </div>
      </section>

      <!-- Section: Nghệ sĩ -->
      <section class="admin-section">
        <h2>Nghệ sĩ</h2>
        <div id="artists-editor"></div>
        <button class="button alt" type="button" id="add-artist">+ Thêm nghệ sĩ</button>
      </section>

      <!-- Section: Bài viết / Tạp chí -->
      <section class="admin-section">
        <h2>Bài viết / Tạp chí</h2>
        <div id="articles-editor"></div>
        <button class="button alt" type="button" id="add-article">+ Đăng bài mới</button>
      </section>

      <!-- Actions -->
      <div class="actions">
        <button class="button" type="submit" id="save-all-btn">Lưu toàn bộ lên Supabase</button>
        <button class="button alt" type="button" id="logout">Đăng xuất</button>
        <a class="button alt" href="index.html" target="_blank">Xem website ↗</a>
      </div>
    </form>
  </main>

  <script type="module" src="assets/admin.js"></script>
</body>
</html>
