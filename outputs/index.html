<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>UniFLOWs Label</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta property="og:image" content="/og-image.jpg">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="index">
  <main>
    <section class="home-hero">
      <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=2200&q=90" alt="Đám đông tại concert">
      <div class="home-content">
        <span class="eyebrow">Independent entertainment / Vietnam</span>
        <h1 data-content="tagline">MAKE THE WORLD MOVE.</h1>
        <p class="home-copy" data-content="heroText"></p>
      </div>
    </section>
    <section class="intro">
      <span class="kicker">01 / Our current</span>
      <div>
        <h2 data-content="aboutTitle"></h2>
        <p data-content="aboutText"></p>
      </div>
    </section>
    <section>
      <div class="section-head">
        <h2>02 / Featured artists</h2>
        <a href="artists" class="kicker">Xem tất cả →</a>
      </div>
      <div class="artists" data-artists></div>
    </section>
    <section class="statement">
      <p>Âm nhạc hay tạo ra <em>kết nối.</em><br>Kết nối tạo ra <em>thay đổi.</em></p>
    </section>
    <section>
      <div class="section-head">
        <h2>03 / Từ UniFLOWs</h2>
        <a href="news" class="kicker">Xem tất cả →</a>
      </div>
      <div class="news-grid" data-articles></div>
    </section>
  </main>
  <script type="module" src="assets/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
