<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>UniFLOWs Label</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta property="og:image" content="/og-image.jpg">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    (function() {
      const host = window.location.hostname.toLowerCase();
      const path = window.location.pathname.toLowerCase();
      if (path === '/' || path === '/index' || path === '/index.html' || path === '') {
        if (host.startsWith('unihub.') || host.startsWith('hube.')) {
          window.location.replace('/unihube');
        } else if (host.startsWith('publishing.')) {
          window.location.replace('/unipublishing');
        } else if (host.startsWith('48k.')) {
          window.location.replace('/48k');
        } else if (host.startsWith('portal.') || host.startsWith('artist.')) {
          window.location.replace('/artist-portal');
        }
      }
    })();
  </script>
</head>
<body data-page="index">
  <main>
    <section class="home-hero">
      <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=2200&q=90" alt="Đám đông tại concert">
      <div class="home-content">
        <span class="eyebrow" data-i18n="home_eyebrow">Independent entertainment / Vietnam</span>
        <h1 data-content="tagline">MAKE THE WORLD MOVE.</h1>
        <p class="home-copy" data-content="heroText"></p>
      </div>
    </section>
    <section class="intro">
      <span class="kicker">01 / Our current</span>
      <div>
        <h2 data-content="aboutTitle"></h2>
        <p data-content="aboutText"></p>
      </div>
    </section>
    <section>
      <div class="section-head">
        <h2 data-i18n="featured_artists">02 / Featured artists</h2>
        <a href="artists" class="kicker" data-i18n="view_all">Xem tất cả →</a>
      </div>
      <div class="artists" data-artists></div>
    </section>
    <section class="statement">
      <p data-i18n="home_statement">Âm nhạc hay tạo ra <em>kết nối.</em><br>Kết nối tạo ra <em>thay đổi.</em></p>
    </section>
    <section>
      <div class="section-head">
        <h2 data-i18n="from_uniflows">03 / Từ UniFLOWs</h2>
        <a href="news" class="kicker" data-i18n="view_all">Xem tất cả →</a>
      </div>
      <div class="news-grid" data-articles></div>
    </section>
  </main>
  <script type="module" src="assets/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
