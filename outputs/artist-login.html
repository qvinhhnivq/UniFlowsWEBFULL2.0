<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Artist Login — UniFLOWs</title><link rel="stylesheet" href="assets/app.css"></head><body><main class="admin"><span class="eyebrow">UniFLOWs / Artist portal</span><h1>Artist<br>login.</h1><p class="portal-note">Không có tài khoản? Liên hệ A&R của UniFLOWs để được mời vào hệ thống.</p><p id="artist-login-error" class="notice">Email hoặc mật khẩu chưa đúng.</p><form id="artist-login-form"><div class="field"><label>Email nghệ sĩ</label><input id="artist-email" required type="email" placeholder="artist@email.com"></div><div class="field"><label>Mật khẩu</label><input id="artist-password" required type="password"></div><div class="actions"><button class="button">Đăng nhập portal</button><a class="button alt" href="index.html">Quay lại website</a></div></form></main><script>document.querySelector('#artist-login-form').onsubmit=e=>{e.preventDefault();if(document.querySelector('#artist-email').value==='lumi@uniflowslabel.com'&&document.querySelector('#artist-password').value==='LumiDemo2026!'){sessionStorage.setItem('uniflows-artist','true');location.href='portal.html'}else document.querySelector('#artist-login-error').style.display='block'}</script></body></html>
