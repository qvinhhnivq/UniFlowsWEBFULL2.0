<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login — UniFLOWs</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <main class="admin">
    <span class="eyebrow">UniFLOWs / Restricted area</span>
    <h1>Quản trị<br>nội dung.</h1>
    <p class="portal-note">Đăng nhập tài khoản Quản trị viên (Admin) để quản lý nghệ sĩ, bài viết và phân phối.</p>
    
    <p id="login-error" class="notice" style="display: none;"></p>
    
    <form id="login-form">
      <div class="field">
        <label for="admin-email">Email quản trị viên</label>
        <input id="admin-email" type="email" required autocomplete="username" placeholder="admin@uniflowslabel.com">
      </div>
      <div class="field">
        <label for="admin-password">Mật khẩu</label>
        <input id="admin-password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="field" style="display:flex;align-items:center;gap:8px;margin-top:-6px;margin-bottom:14px;">
        <input type="checkbox" id="admin-remember-me" checked style="width:auto;margin:0;cursor:pointer;">
        <label for="admin-remember-me" style="margin:0;font-size:13px;cursor:pointer;user-select:none;">Lưu đăng nhập trên thiết bị này</label>
      </div>
      <div class="actions">
        <button class="button" type="submit" id="submit-btn">Đăng nhập Admin</button>
        <a class="button alt" href="index">Quay lại website</a>
      </div>
    </form>
  </main>
  <script type="module" src="assets/login.js"></script>
</body>
</html>
