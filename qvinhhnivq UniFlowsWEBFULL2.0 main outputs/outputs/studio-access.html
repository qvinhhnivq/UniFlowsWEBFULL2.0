<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Studio Access — UniFLOWs</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <main class="admin discreet-login">
    <span class="eyebrow">UniFLOWs / Internal</span>
    <h1>Studio<br>access.</h1>
    <p id="login-error" class="notice" style="display: none;"></p>
    <form id="login-form">
      <div class="field">
        <label for="admin-email">Admin Email</label>
        <input id="admin-email" type="email" required autocomplete="username" placeholder="admin@uniflowslabel.com">
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input id="admin-password" type="password" required autocomplete="current-password">
      </div>
      <div class="actions">
        <button class="button" id="submit-btn">Continue</button>
        <a class="button alt" href="index.html">Exit</a>
      </div>
    </form>
  </main>
  <script type="module" src="assets/login.js"></script>
</body>
</html>
